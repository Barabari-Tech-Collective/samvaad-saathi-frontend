name: CI

on:
  pull_request:
  push:
    branches: [Manager-Arma-new-samvaad-10, staging, main]
  workflow_call:

permissions:
  contents: read

jobs:
  quality:
    name: Lint, Type-Check & Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint && npm run lint:release

      - name: Regression tests
        run: npm test -- --reporter=default --reporter=junit --outputFile=test-results/unit.xml

      - name: Type check
        run: npm run type-check

      - name: Build
        run: npm run build

      - name: Install browser
        run: npx playwright install --with-deps chromium

      - name: Browser recording and failure recovery
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-test-results
          path: test-results/

  security:
    name: Production dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm audit --omit=dev --audit-level=high
